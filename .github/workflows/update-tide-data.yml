name: Update CWA tide data

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-cwa-tide-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/

      - name: Download and validate CWA tide data
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          test -n "$CWA_API_KEY"
          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: $CWA_API_KEY" \
            "https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-A0021-001?format=JSON" \
            --output _site/data/tide.json
          jq -e '(.success == true or .success == "true") and (.records != null)' _site/data/tide.json >/dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
